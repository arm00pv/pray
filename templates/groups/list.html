{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2>My Prayer Groups</h2>
        {% if my_groups %}
            <div class="list-group">
                {% for member in my_groups %}
                <a href="{{ url_for('group.view_group', group_id=member.group.id) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">{{ member.group.name }}</h5>
                        <small>{{ member.group.description }}</small>
                    </div>
                    <span class="badge bg-primary rounded-pill">{{ member.role }}</span>
                </a>
                {% endfor %}
            </div>
        {% else %}
            <p>You are not in any groups yet.</p>
        {% endif %}
    </div>

    <div class="col-md-4">
        <div class="card mb-4">
            <div class="card-header">Join a Group</div>
            <div class="card-body">
                <form action="{{ url_for('group.join_group') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="code" class="form-label">Group Code</label>
                        <input type="text" class="form-control" id="code" name="code" placeholder="Enter code" required>
                    </div>
                    <button type="submit" class="btn btn-outline-primary w-100">Join</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Create a Group</div>
            <div class="card-body">
                <form action="{{ url_for('group.create_group') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <label for="name" class="form-label">Group Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Create Group</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
