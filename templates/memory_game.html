{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h2>{{ _('Scripture Memory Game') }}</h2>
        <p>{{ _('Fill in the missing words.') }}</p>

        <div class="card mt-4">
            <div class="card-body">
                <h4 id="verse-ref">John 3:16</h4>
                <p id="verse-text" class="lead mt-3">
                    For God so <input type="text" class="form-control d-inline w-auto" data-answer="loved"> the world that he gave his one and only <input type="text" class="form-control d-inline w-auto" data-answer="Son">...
                </p>

                <div id="feedback" class="mt-3"></div>

                <button class="btn btn-primary mt-3" onclick="checkAnswers()">{{ _('Check Answers') }}</button>
                <button class="btn btn-secondary mt-3" onclick="location.reload()">{{ _('New Verse') }}</button>
            </div>
        </div>
    </div>
</div>

<script>
    const verses = [
        {
            ref: "John 3:16",
            text: "For God so [loved] the world that he gave his one and only [Son], that whoever believes in him shall not perish but have eternal [life]."
        },
        {
            ref: "Philippians 4:13",
            text: "I can do all this through [him] who gives me [strength]."
        },
        {
            ref: "Psalm 23:1",
            text: "The [Lord] is my shepherd, I lack [nothing]."
        }
    ];

    // Pick random verse on load (Client-side for demo simplicity)
    const verse = verses[Math.floor(Math.random() * verses.length)];

    document.getElementById('verse-ref').innerText = verse.ref;

    // Replace [word] with input
    let html = verse.text.replace(/\[(.*?)\]/g, '<input type="text" class="form-control d-inline w-auto mx-1" style="min-width: 80px;" data-answer="$1">');
    document.getElementById('verse-text').innerHTML = html;

    function checkAnswers() {
        const inputs = document.querySelectorAll('input[data-answer]');
        let correct = 0;

        inputs.forEach(input => {
            if (input.value.toLowerCase().trim() === input.dataset.answer.toLowerCase()) {
                input.classList.add('is-valid');
                input.classList.remove('is-invalid');
                correct++;
            } else {
                input.classList.add('is-invalid');
                input.classList.remove('is-valid');
            }
        });

        const feedback = document.getElementById('feedback');
        if (correct === inputs.length) {
            feedback.innerHTML = '<span class="text-success fw-bold">{{ _("Perfect! Well done!") }}</span>';
        } else {
            feedback.innerHTML = '<span class="text-danger">{{ _("Keep trying!") }}</span>';
        }
    }
</script>
{% endblock %}
