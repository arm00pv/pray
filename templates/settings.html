{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>{{ _('Profile Settings') }}</h2>

        <div class="card mb-4">
            <div class="card-header">{{ _('Update Profile') }}</div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="action" value="update_profile">
                    <div class="mb-3">
                        <label class="form-label">{{ _('Username') }}</label>
                        <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                        <div class="form-text">{{ _('Username cannot be changed.') }}</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ _('Email Address') }}</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email or '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="about_me" class="form-label">{{ _('About Me') }}</label>
                        <textarea class="form-control" id="about_me" name="about_me" rows="3" placeholder="{{ _('Share a little about yourself...') }}">{{ current_user.about_me or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">{{ _('Save Changes') }}</button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">{{ _('Change Password') }}</div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="action" value="change_password">
                    <div class="mb-3">
                        <label for="current_password" class="form-label">{{ _('Current Password') }}</label>
                        <input type="password" class="form-control" id="current_password" name="current_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">{{ _('New Password') }}</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required>
                    </div>
                    <button type="submit" class="btn btn-warning">{{ _('Change Password') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
