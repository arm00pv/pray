{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ _('Bible Reading Plan') }}</h2>
            <div class="text-muted">
                {{ completed_count }} / 365 {{ _('Days Completed') }}
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
                    {% for day in range(1, 366) %}
                    <div class="col">
                        <div class="card h-100 text-center {% if day in completed_days %}border-success bg-success-subtle{% endif %}">
                            <div class="card-body p-2 d-flex flex-column justify-content-between">
                                <h6 class="card-title">{{ _('Day') }} {{ day }}</h6>
                                <small class="d-block text-truncate mb-2" title="{{ get_plan(day) }}">
                                    {{ get_plan(day) }}
                                </small>

                                <form action="{{ url_for('reading.mark_plan_read', day_id=day) }}" method="POST">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                    {% if day in completed_days %}
                                        <button type="submit" class="btn btn-sm btn-success w-100">✅</button>
                                    {% else %}
                                        <button type="submit" class="btn btn-sm btn-outline-primary w-100">{{ _('Mark') }}</button>
                                    {% endif %}
                                </form>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
