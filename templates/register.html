{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header h5 border-0 bg-transparent pt-4 px-4">{{ _('User Registration') }}</div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-4">
                        <label for="username" class="form-label text-muted small text-uppercase">{{ _('Username') }}</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="{{ _('Choose a unique username') }}" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted small text-uppercase">{{ _('Email Address (Optional)') }}</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small text-uppercase">{{ _('Password') }}</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
                        <div class="mt-2">
                            <small class="text-muted">{{ _('Password Strength') }}:</small>
                            <div class="progress" style="height: 5px;">
                                <div id="strength-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                        <ul class="list-unstyled mt-2 small text-muted" id="password-requirements">
                            <li id="req-length">❌ {{ _('At least 8 characters') }}</li>
                            <li id="req-upper">❌ {{ _('One uppercase letter') }}</li>
                            <li id="req-lower">❌ {{ _('One lowercase letter') }}</li>
                            <li id="req-number">❌ {{ _('One number') }}</li>
                        </ul>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">{{ _('Confirm Password') }}</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label for="security_question" class="form-label">{{ _('Security Question') }}</label>
                        <select class="form-select" id="security_question" name="security_question" required>
                            <option value="">{{ _('Select a question...') }}</option>
                            <option value="What was the name of your first pet?">{{ _('What was the name of your first pet?') }}</option>
                            <option value="What is your mother's maiden name?">{{ _('What is your mother\'s maiden name?') }}</option>
                            <option value="What city were you born in?">{{ _('What city were you born in?') }}</option>
                            <option value="What is the name of your favorite book?">{{ _('What is the name of your favorite book?') }}</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="security_answer" class="form-label">{{ _('Security Answer') }}</label>
                        <input type="text" class="form-control" id="security_answer" name="security_answer" required>
                    </div>
                    <button type="submit" class="btn btn-primary">{{ _('Register') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function checkPasswordStrength() {
    var password = document.getElementById("password").value;
    var strength = 0;

    // Requirements
    var hasLength = password.length >= 8;
    var hasUpper = /[A-Z]/.test(password);
    var hasLower = /[a-z]/.test(password);
    var hasNumber = /\d/.test(password);

    // Update UI List
    document.getElementById("req-length").innerHTML = hasLength ? "✅ {{ _('At least 8 characters') }}" : "❌ {{ _('At least 8 characters') }}";
    document.getElementById("req-upper").innerHTML = hasUpper ? "✅ {{ _('One uppercase letter') }}" : "❌ {{ _('One uppercase letter') }}";
    document.getElementById("req-lower").innerHTML = hasLower ? "✅ {{ _('One lowercase letter') }}" : "❌ {{ _('One lowercase letter') }}";
    document.getElementById("req-number").innerHTML = hasNumber ? "✅ {{ _('One number') }}" : "❌ {{ _('One number') }}";

    if (hasLength) strength += 1;
    if (hasUpper) strength += 1;
    if (hasLower) strength += 1;
    if (hasNumber) strength += 1;

    var bar = document.getElementById("strength-bar");
    var width = (strength / 4) * 100;

    bar.style.width = width + "%";

    if (strength < 2) {
        bar.className = "progress-bar bg-danger";
    } else if (strength < 4) {
        bar.className = "progress-bar bg-warning";
    } else {
        bar.className = "progress-bar bg-success";
    }
}
</script>
{% endblock %}
