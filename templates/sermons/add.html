{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">{{ _('Add Sermon Note') }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">{{ _('Sermon Title') }}</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="preacher" class="form-label">{{ _('Preacher/Speaker') }}</label>
                            <input type="text" class="form-control" id="preacher" name="preacher">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="scripture" class="form-label">{{ _('Key Scripture') }}</label>
                            <input type="text" class="form-control" id="scripture_reference" name="scripture_reference" placeholder="e.g. John 3:16">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">{{ _('Notes') }}</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                         <a href="{{ url_for('sermon.index') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
                         <button type="submit" class="btn btn-primary">{{ _('Save Note') }}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
