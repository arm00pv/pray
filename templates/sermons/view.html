{% extends "base.html" %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('sermon.list_sermons') }}" class="btn btn-link">&larr; Back to Notes</a>
</div>

<div class="card">
    <div class="card-header">
        <h2>{{ note.title }}</h2>
        <span class="text-muted">{{ note.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-6">
                <strong>Preacher:</strong> {{ note.preacher if note.preacher else 'N/A' }}
            </div>
            <div class="col-md-6">
                <strong>Scripture:</strong> {{ note.scripture if note.scripture else 'N/A' }}
            </div>
        </div>
        <hr>
        <div class="mt-3" style="white-space: pre-wrap;">{{ note.content }}</div>
    </div>
</div>
{% endblock %}
