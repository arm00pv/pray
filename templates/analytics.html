{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>{{ _('My Prayer Analytics') }}</h2>

        <div class="card mb-4">
            <div class="card-header">{{ _('Top Prayer Topics') }}</div>
            <div class="card-body">
                <canvas id="tagsChart"></canvas>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">{{ _('Prayer Categories') }}</div>
            <div class="card-body">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">{{ _('Mood Distribution') }}</div>
                    <div class="card-body">
                        <canvas id="moodChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">{{ _('Activity Timeline (Last 30 Days)') }}</div>
                    <div class="card-body">
                        <canvas id="timelineChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <a href="{{ url_for('entry.user_dashboard') }}" class="btn btn-secondary">{{ _('Back to Dashboard') }}</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('tagsChart').getContext('2d');
    const tagsChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ labels | tojson }},
            datasets: [{
                label: "{{ _('Prayer Count') }}",
                data: {{ data | tojson }},
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });

    const ctxCat = document.getElementById('categoryChart').getContext('2d');
    const categoryChart = new Chart(ctxCat, {
        type: 'pie',
        data: {
            labels: {{ cat_labels | tojson }},
            datasets: [{
                data: {{ cat_data | tojson }},
                backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(75, 192, 192, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 1
            }]
        }
    });

    const ctxMood = document.getElementById('moodChart').getContext('2d');
    const moodChart = new Chart(ctxMood, {
        type: 'doughnut',
        data: {
            labels: {{ mood_labels | tojson }},
            datasets: [{
                data: {{ mood_data | tojson }},
                backgroundColor: [
                    '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
                ],
                borderWidth: 1
            }]
        }
    });

    const ctxTimeline = document.getElementById('timelineChart').getContext('2d');
    const timelineChart = new Chart(ctxTimeline, {
        type: 'line',
        data: {
            labels: {{ date_labels | tojson }},
            datasets: [{
                label: "{{ _('Entries') }}",
                data: {{ timeline_data | tojson }},
                fill: true,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });
</script>
{% endblock %}
