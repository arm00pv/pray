{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>{{ _('Gratitude Journal') }}</h2>

        <div class="card mb-4">
            <div class="card-body">
                <form action="{{ url_for('gratitude.add_entry') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3">
                        <textarea class="form-control" name="content" rows="3" placeholder="{{ _('What are you grateful for today?') }}" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">{{ _('Add Gratitude') }}</button>
                </form>
            </div>
        </div>

        <div class="list-group">
            {% for entry in entries %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <p class="mb-1">{{ entry.content }}</p>
                    <small class="text-muted">{{ entry.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
                </div>
                <form action="{{ url_for('gratitude.delete_entry', entry_id=entry.id) }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger">&times;</button>
                </form>
            </div>
            {% else %}
            <div class="list-group-item">{{ _('No gratitude entries yet.') }}</div>
            {% endfor %}
        </div>

        <div class="mt-3">
            <a href="{{ url_for('entry.user_dashboard') }}" class="btn btn-secondary">{{ _('Back to Dashboard') }}</a>
        </div>
    </div>
</div>
{% endblock %}
